<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">SMEM-Q block diagram for GPGPU-Sim warp specialization</title>
  <desc id="desc">Block diagram showing an SM with warp scheduler, register file, LSU, execution units, and a shared-memory-backed queue with valid metadata connected to the scheduler.</desc>
  <defs>
    <marker id="arrow-dark" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#23323f"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#1b6f9c"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2f7d4f"/>
    </marker>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#17202a" flood-opacity="0.18"/>
    </filter>
    <style>
      .bg { fill: #f7f8fa; }
      .panel { fill: #ffffff; stroke: #24313d; stroke-width: 2; filter: url(#soft-shadow); }
      .subpanel { fill: #eef3f7; stroke: #4b5d70; stroke-width: 1.5; }
      .rf { fill: #f7efe4; stroke: #8a6336; stroke-width: 1.5; }
      .smem { fill: #e9f6ee; stroke: #2f7d4f; stroke-width: 2; }
      .valid { fill: #fff6d9; stroke: #9a7919; stroke-width: 1.5; }
      .queue-slot { fill: #ffffff; stroke: #2f7d4f; stroke-width: 1; }
      .queue-slot-valid { fill: #fff2bd; stroke: #9a7919; stroke-width: 1; }
      .title { font: 700 25px Arial, sans-serif; fill: #17202a; }
      .h1 { font: 700 20px Arial, sans-serif; fill: #17202a; }
      .h2 { font: 700 16px Arial, sans-serif; fill: #17202a; }
      .txt { font: 14px Arial, sans-serif; fill: #263442; }
      .small { font: 12px Arial, sans-serif; fill: #34495e; }
      .label-blue { font: 700 13px Arial, sans-serif; fill: #1b6f9c; }
      .label-green { font: 700 13px Arial, sans-serif; fill: #2f7d4f; }
      .label-brown { font: 700 13px Arial, sans-serif; fill: #8a6336; }
      .arrow { fill: none; stroke: #23323f; stroke-width: 2; marker-end: url(#arrow-dark); }
      .arrow-blue { fill: none; stroke: #1b6f9c; stroke-width: 2.4; marker-end: url(#arrow-blue); }
      .arrow-green { fill: none; stroke: #2f7d4f; stroke-width: 2.4; marker-end: url(#arrow-green); }
      .dash { stroke-dasharray: 7 5; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1200" height="760"/>
  <text class="title" x="40" y="45">Shared-Memory-Backed Queue for Warp-Specialized GPGPU-Sim</text>
  <text class="txt" x="40" y="72">Producer warps fill queue entries; consumer warp readiness is exposed to the scheduler through valid metadata.</text>

  <rect class="panel" x="55" y="115" width="670" height="560" rx="8"/>
  <text class="h1" x="85" y="150">Streaming Multiprocessor (SM)</text>

  <rect class="subpanel" x="85" y="180" width="250" height="95" rx="6"/>
  <text class="h2" x="105" y="210">Warp Scheduler</text>
  <text class="txt" x="105" y="234">Selects eligible producer</text>
  <text class="txt" x="105" y="254">and consumer warps</text>

  <rect class="subpanel" x="390" y="180" width="265" height="95" rx="6"/>
  <text class="h2" x="410" y="210">Scoreboard / Control</text>
  <text class="txt" x="410" y="234">Dependencies, queue state,</text>
  <text class="txt" x="410" y="254">and warp readiness checks</text>

  <rect class="rf" x="85" y="330" width="250" height="145" rx="6"/>
  <text class="h2" x="105" y="360">Register File (RF)</text>
  <text class="txt" x="105" y="386">Normal registers</text>
  <text class="txt" x="105" y="410">RFQ payload storage</text>
  <text class="small" x="105" y="438">V3: queue entries reduce</text>
  <text class="small" x="105" y="456">CTA/SM through RF pressure</text>

  <rect class="subpanel" x="390" y="330" width="130" height="145" rx="6"/>
  <text class="h2" x="420" y="365">LSU</text>
  <text class="txt" x="410" y="392">Global</text>
  <text class="txt" x="410" y="414">loads</text>
  <text class="txt" x="410" y="436">stores</text>

  <rect class="subpanel" x="555" y="330" width="130" height="145" rx="6"/>
  <text class="h2" x="584" y="365">FP32</text>
  <text class="txt" x="578" y="392">FMA</text>
  <text class="txt" x="578" y="414">compute</text>

  <rect class="subpanel" x="170" y="535" width="450" height="78" rx="6"/>
  <text class="h2" x="195" y="565">Producer / Consumer Warp Roles</text>
  <text class="txt" x="195" y="590">Warps 0-3: producers load a,b,c. Warps 4-7: consumers compute and store.</text>

  <rect class="panel" x="790" y="155" width="360" height="480" rx="8"/>
  <text class="h1" x="820" y="190">Shared Memory Queue (SMEM-Q)</text>

  <rect class="smem" x="825" y="225" width="285" height="235" rx="6"/>
  <text class="h2" x="850" y="255">SMEM Payload Buffer</text>
  <text class="txt" x="850" y="280">Queue entries hold {a,b,c}</text>
  <text class="small" x="850" y="304">4 producer warps x 32 entries x</text>
  <text class="small" x="850" y="322">3 words/lane x 32 lanes x 4 B</text>

  <rect class="queue-slot" x="860" y="345" width="65" height="38" rx="4"/>
  <text class="small" x="876" y="369">slot 0</text>
  <rect class="queue-slot" x="940" y="345" width="65" height="38" rx="4"/>
  <text class="small" x="956" y="369">slot 1</text>
  <rect class="queue-slot" x="1020" y="345" width="65" height="38" rx="4"/>
  <text class="small" x="1036" y="369">slot 2</text>
  <rect class="queue-slot" x="860" y="398" width="65" height="38" rx="4"/>
  <text class="small" x="876" y="422">...</text>
  <rect class="queue-slot" x="940" y="398" width="65" height="38" rx="4"/>
  <text class="small" x="956" y="422">slot n</text>
  <rect class="queue-slot" x="1020" y="398" width="65" height="38" rx="4"/>
  <text class="small" x="1036" y="422">tail</text>

  <rect class="valid" x="825" y="495" width="285" height="85" rx="6"/>
  <text class="h2" x="850" y="525">Valid / Ready Metadata</text>
  <rect class="queue-slot-valid" x="850" y="545" width="35" height="20" rx="3"/>
  <rect class="queue-slot-valid" x="895" y="545" width="35" height="20" rx="3"/>
  <rect class="queue-slot-valid" x="940" y="545" width="35" height="20" rx="3"/>
  <rect class="queue-slot-valid" x="985" y="545" width="35" height="20" rx="3"/>
  <text class="small" x="1030" y="560">head valid bit</text>

  <path class="arrow-blue" d="M 520 405 C 660 405, 725 345, 825 345"/>
  <text class="label-blue" x="610" y="380">producer global-load responses write payload</text>

  <path class="arrow-green" d="M 825 530 C 650 520, 470 285, 305 235"/>
  <text class="label-green" x="560" y="505">valid/ready signal to scheduler</text>

  <path class="arrow-green" d="M 825 415 C 695 440, 650 440, 555 420"/>
  <text class="label-green" x="620" y="455">consumer reads ready head entry</text>

  <path class="arrow" d="M 335 225 L 390 225"/>
  <path class="arrow" d="M 520 405 L 555 405"/>
  <path class="arrow" d="M 620 330 L 620 275 L 335 235"/>

  <path class="arrow dash" d="M 210 330 C 235 300, 285 290, 390 365"/>
  <text class="label-brown" x="125" y="505">RFQ contrast: payload occupies RF capacity</text>
  <path class="arrow dash" d="M 210 475 C 250 515, 450 515, 820 580"/>

  <rect class="subpanel" x="55" y="690" width="1095" height="38" rx="6"/>
  <text class="small" x="80" y="714">Report interpretation: SMEM-Q shifts queue payload storage from RF to shared memory, while valid metadata remains scheduler-visible so consumer warps are only eligible when the queue head is ready.</text>
</svg>
